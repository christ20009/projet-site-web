<!-- ========================= -->
    <!-- PAGE INSCRIPTION -->
    <!-- ========================= -->

    <main class="inscription-page">


        <h1>
            Créer un compte
        </h1>


        <div class="inscription-container">


            <form>


                <!-- NOM ET PRÉNOM -->

                <div class="ligne-champs">


                    <div class="champ">

                        <label for="nom">
                            Nom
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="nom"
                                name="nom"
                                placeholder="Votre nom"
                                required
                            >

                        </div>

                    </div>



                    <div class="champ">

                        <label for="prenom">
                            Prénom
                        </label>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="prenom"
                                name="prenom"
                                placeholder="Votre prénom"
                                required
                            >

                        </div>

                    </div>


                </div>



                <!-- EMAIL -->

                <div class="champ">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Votre adresse e-mail"
                            required
                        >

                    </div>

                </div>



                <!-- MOT DE PASSE -->

                <div class="champ">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Votre mot de passe"
                            required
                        >

                    </div>

                </div>



                <!-- CONFIRMATION MOT DE PASSE -->

                <div class="champ">

                    <label for="confirmation">

                        Confirmation du mot de passe

                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmation"
                            name="confirmation"
                            placeholder="Confirmez votre mot de passe"
                            required
                        >

                    </div>

                </div>



                <!-- BOUTON -->

                <button type="submit">

                    S'INSCRIRE

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- RETOUR CONNEXION -->

                <p class="deja-compte">

                    Vous avez déjà un compte ?

                    <a href="connexion.html">
                        Se connecter
                    </a>

                </p>


            </form>


        </div>


    </main>
