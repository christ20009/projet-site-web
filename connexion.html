<!-- ========================= -->
    <!-- PAGE CONNEXION -->
    <!-- ========================= -->

    <main class="connexion-page">


        <h1>Connexion</h1>


        <!-- ========================= -->
        <!-- FORMULAIRE -->
        <!-- ========================= -->

        <div class="connexion-container">


            <form>


                <!-- EMAIL -->

                <div class="champ">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-box">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </div>

                </div>



                <!-- MOT DE PASSE -->

                <div class="champ">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        >

                        <i class="fa-regular fa-eye eye"></i>

                    </div>

                </div>



                <!-- OPTIONS -->

                <div class="options">


                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>
                            Se souvenir de moi
                        </span>

                    </label>


                    <a href="inscription.html">
                        Mot de passe oublié ?
                    </a>


                </div>



                <!-- BOUTON -->

                <button type="submit">

                    <span>
                        Se connecter
                    </span>

                    <span class="arrow">
                        →
                    </span>

                </button>



                <!-- INSCRIPTION -->

                <p class="nouveau-client">

                    Nouveau client ?

                    <a href="inscription.html">
                        Créer mon compte
                    </a>

                </p>


            </form>


        </div>


    </main>
